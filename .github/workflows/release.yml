name: Release

# Runs when a version tag is pushed. It builds and publishes; it never commits.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "Tag is v$tag but package.json is $pkg"
            exit 1
          fi

      - name: Package
        run: npm run package

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: Versions/plop-*-chrome.zip
          generate_release_notes: true
